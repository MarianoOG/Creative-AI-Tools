# Install once per clone:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: youtube-scout-guard
        name: youtube-scout secrets and local data guard
        entry: python3 youtube-scout/scripts/guard.py
        language: system
